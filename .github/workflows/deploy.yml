name: "Deploy APEX TRUST Customer Value Segmentation FastAPI"

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =========================================
      # CHECKOUT REPOSITORY
      # =========================================
      - name: Checkout Repository
        uses: actions/checkout@v3

      # =========================================
      # LOGIN TO DOCKER HUB
      # =========================================
      - name: Login To DockerHub
        uses: docker/login-action@v2

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================================
      # BUILD DOCKER IMAGE
      # =========================================
      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/apex-backend-app:latest .

      # =========================================
      # PUSH IMAGE TO DOCKER HUB
      # =========================================
      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/apex-backend-app:latest

      # =========================================
      # DEPLOY TO EC2
      # =========================================
      - name: Deploy To AWS EC2

        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh -o "StrictHostChecking=no" \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            export MONGO_URI="${{ secrets.MONGO_URI }}"
            export MLFLOW_TOKEN="${{ secrets.MLFLOW_TOKEN }}"

            cd ~/app

            docker pull ${{ secrets.DOCKER_USERNAME }}/apex-backend-app:latest

            docker stop apex-backend-app || true

            docker rm apex-backend-app || true

            docker run -d \
              --name apex-backend-app \
              -p 8000:8000 \
              -e MONGO_URI="$MONGO_URI" \
              -e MLFLOW_TOKEN="$MLFLOW_TOKEN" \
              ${{ secrets.DOCKER_USERNAME }}/apex-backend-app:latest

          EOF